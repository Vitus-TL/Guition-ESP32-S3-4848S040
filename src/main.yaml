packages:
  loading_page: !include common/widgets/loading.yaml
  home: !include widgets/home/home.yaml
  light: !include widgets/light/config.yaml
  devices: !include common/widgets/devices.yaml
  climate: !include widgets/climate/climate.yaml
  media_player: !include widgets/media_player/media_player.yaml
  # vacuum: !include widgets/vacuum/vacuum.yaml
  # cover: !include widgets/cover/config.yaml
  boiler: !include widgets/boiler/config.yaml
  # alarm_panel: !include widgets/alarm_panel/config.yaml
  fan: !include widgets/fan/config.yaml


substitutions: !include common/substitutions.yaml
image: !include common/image.yaml
font: !include common/fonts.yaml
color: !include common/colors.yaml

http_request:
  verify_ssl: false

external_components:
  - source: github://alaltitov/esphome@dev
    components: [i18n]

i18n:
  id: i18n_translations
  sources:
    - translations/en.yaml
    - translations/es.yaml
    - translations/fr.yaml
    - translations/nl.yaml
    - translations/pl.yaml
    - translations/ru.yaml
    - translations/si.yaml
    - translations/it.yaml
    - translations/de.yaml
  default_locale: en
  use_psram: true
  buffer_size: "512"

esphome:
  name: ${display_name}
  friendly_name: ${display_friendly_name}
  min_version: 2026.1.0
  includes:
    - <sstream>
    - <algorithm>
  platformio_options:
    board_build.f_cpu: 240000000L
    board_build.flash_mode: dio
    board_build.filesystem: littlefs
    board_build.cmake_extra_args: -DCMAKE_C_COMPILER_LAUNCHER=ccache ~/.esphome/platformio/packages/tool-riscv32-esp-elf/bin/riscv32-esp-elf-gcc -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ~/.esphome/platformio/packages/tool-riscv32-esp-elf/bin/riscv32-esp-elf-gcc

  on_boot:
    - priority: 400
      then:
        - lambda: |-
            id(i18n_translations).set_current_locale(id(current_language));
        - script.execute: update_loading_page
    - priority: -100
      then:
        - lvgl.roller.update:
            id: backlight_settings_sleep_time_roller
            selected_index: !lambda return id(display_timeout);
    #    - priority: 600.0 # AFTER_WIFI (200) but BEFORE sensors/components (~500). PLL_D2 stable, PM configurable.
    #  then:
    #    - lambda: |-
    #        esp_pm_lock_acquire(ESP_PM_CPU_FREQ_MAX);
    #        esp_pm_config_t pm = {.max_freq_mhz=240, .min_freq_mhz=80};
    #        esp_pm_configure(&pm);

esp32:
  # board: esp32-s3-devkitc-1
  # board: 4d_systems_esp32s3_gen4_r8n16
  board: esp32s3box
  variant: esp32s3
  cpu_frequency: 240MHz  # Defaults at 160Mhz
  flash_size: 16MB
  partitions: "common/partitions_16mb.csv"
  framework:
    type: esp-idf
    advanced:
      loop_task_stack_size: 8192
    sdkconfig_options:
      CONFIG_ESP_DEFAULT_CPU_FREQ_240: "y"
      # CONFIG_ESP32S3_DEFAULT_CPU_FREQ_160: "n"
      # CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ: "240"
      CONFIG_PM_ENABLE: "n"  
      # CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: y
      # CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      # CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      # CONFIG_ESP_MAIN_TASK_STACK_SIZE: "16384"
      # CONFIG_ESP_MAIN_TASK_STACK_SIZE: "65536"
      CONFIG_SPIRAM_MODE_OCT: "y" 
      CONFIG_SPIRAM_SPEED_80M: "y"  
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "60"
      # CONFIG_FREERTOS_USE_TRACE_FACILITY: "y"
      # CONFIG_FREERTOS_USE_STATS_FORMATTING_FUNCTIONS: "y"
      # CONFIG_FREERTOS_GENERATE_RUN_TIME_STATS: "y"
      # CONFIG_FREERTOS_RUN_TIME_STATS_USING_ESP_TIMER: "y"
      CONFIG_LOG_DEFAULT_LEVEL: "DEBUG" 
      CONFIG_LOG_MAXIMUM_LEVEL: "VERBOSE"
      CONFIG_ESP_ERR_TO_NAME_LOOKUP: "y"
      CONFIG_ESPTOOLPY_FLASHSIZE_16MB: "y"
      CONFIG_PARTITION_TABLE_CUSTOM: "common/partitions_16mb.csv"

psram:
  mode: octal
  speed: 80MHz

# The following five labels contain debug settings and should be disabled for normal operation

logger:
  level: debug
#  level: VERY_VERBOSE
  logs:
    # component: NONE
    esp_pm: DEBUG
    esp_pm_trace: DEBUG
    ota: INFO
    lvgl: info
  hardware_uart: UART0

debug:
  update_interval: 10s

text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset Reason"
    device:
      name: "Device Info"

sensor:
  - platform: debug
    loop_time:
      name: "Loop Time"
    cpu_frequency:
      name: "CPU Frequency"
      id: cpu_freq_hz
    free:
      name: "Heap Free"
      id: sram_free  
    block:
      name: "Heap Max Block"
      id: max_heap_block
    psram:
      name: "Free PSRAM"
      id: psram_free 
  - platform: template
    id: sram_total
    name: "Total SRAM KB"
    unit_of_measurement: "KB"
    accuracy_decimals: 0
    lambda: |-
      size_t total_dram = heap_caps_get_total_size(MALLOC_CAP_INTERNAL | MALLOC_CAP_DMA);
      return (int)(total_dram);
  - platform: template
    id: psram_total
    name: "Total PSRAM KB"
    unit_of_measurement: "KB"
    accuracy_decimals: 0
    lambda: |-
      // Work-around until I can figure out how to obtain real values
      constexpr int PSRAM_SIZE = 8388608;  // N16R8 standard
      return PSRAM_SIZE;

runtime_stats:
  log_interval: 60s

api:
  encryption:
    key: !secret display_key

ota:
  - platform: esphome
    id: ota_state
    password: !secret display_ota
    on_begin: 
      - logger.log: "OTA Start"
      - light.turn_on: display_backlight
      - lambda: "id(display_backlight).loop();"
      - lvgl.resume:
      - lvgl.widget.redraw:
      - lvgl.label.update:
          id: ota_label_primary
          text: !lambda |-
            return id(i18n_translations).translate("ota.start.primary");
      - lvgl.label.update:
          id: ota_label_secondary
          text: !lambda |-
            return id(i18n_translations).translate("ota.start.secondary");
      - lvgl.widget.show: ota_widget
      - lvgl.resume:
      - lvgl.widget.redraw:
      - lambda: "id(lvgl_component).loop();"
      - lambda: "id(lvgl_component).loop();"
      - logger.log: "OTA widget shown"

    on_progress: 
      - lvgl.bar.update:
          id: ota_bar_value
          value: !lambda return (int)x;
      - lvgl.label.update:
          id: ota_label_primary
          text: " "
      - lvgl.label.update:
          id: ota_label_secondary
          text: !lambda |-
            static char buffer[64];
            snprintf(buffer, sizeof(buffer), id(i18n_translations).translate("ota.progress").c_str(), x);
            return buffer;
      - lambda: "id(lvgl_component).loop();"

    on_end:
      - logger.log: "OTA End"
      - lvgl.bar.update:
          id: ota_bar_value
          value: 100
      - lvgl.label.update:
          id: ota_label_primary
          text: !lambda |-
            return id(i18n_translations).translate("ota.end.primary");
      - lvgl.label.update:
          id: ota_label_secondary
          text: !lambda |-
            return id(i18n_translations).translate("ota.end.secondary");
      - lambda: |-
          id(lvgl_component).loop();

    on_error:
      - logger.log:
            format: "OTA update error %d"
            args: ["x"]
      - lvgl.label.update:
          id: ota_label_primary
          text: !lambda |-
            return id(i18n_translations).translate("ota.error.primary");
      - lvgl.label.update:
          id: ota_label_secondary
          text: !lambda |-
            return id(i18n_translations).translate("ota.error.secondary");
      - lambda: |-
          id(lvgl_component).loop();


wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  on_connect:
    - lvgl.label.update:
        id: wifi_status
        text_color: color_green
  on_disconnect:
    - lvgl.label.update:
        id: wifi_status
        text_color: color_steel_blue


lvgl:
  id: lvgl_component
  color_depth: 16
  byte_order: big_endian
  displays: ${display_name}
  touchscreens:
    - touchscreen_id: touchscreen_id
      long_press_time: 5000ms
      long_press_repeat_time: 400ms
  page_wrap: false
  top_layer:
    widgets:
      - obj:
          id: ota_widget
          hidden: true
          width: 480
          height: 480
          align: center
          clickable: false
          bg_color: color_slate_blue_gray
          border_opa: transp
          shadow_opa: transp
          radius: 0
          widgets:
            - label:
                id: ota_label_primary
                y: -50
                align: center
                text_font: nunito_20
                text_color: color_misty_blue
                text: "Starting OTA!"
            - label:
                id: ota_label_secondary
                y: -20
                align: center
                text_font: nunito_18
                text_color: color_misty_blue
                text: "Wait..."
            - bar:
                id: ota_bar_value
                y: 20
                width: 300
                value: 0
                align: center
                min_value: 0
                max_value: 100
                animated: true
                bg_color: color_steel_blue
                indicator:
                  bg_color: color_misty_blue
  

light:
  # Backlight
  - platform: monochromatic
    output: backlight_output
    name: Backlight
    id: display_backlight
    restore_mode: ALWAYS_ON
    on_turn_on:
      - if:
          condition: lvgl.is_paused
          then:
            - logger.log: "LVGL resuming by backlight on"
            - lvgl.resume:
            - lvgl.widget.redraw:
    on_turn_off:
      - if:
          condition:
            lambda: 'return id(display_timeout_backlight).state >= 0;'
          then:
            - logger.log: "Backlight off, pausing LVGL"
            - lvgl.pause:

output:
    # Backlight LED
  - platform: ledc
    pin: GPIO38
    id: backlight_output
    frequency: 100Hz

i2c:
  - id: bus_a
    sda: GPIO19
    scl:
      number: GPIO45
      ignore_strapping_warning: true
    frequency: 100kHz


touchscreen:
  platform: gt911
  id: touchscreen_id
  transform:
    mirror_x: false
    mirror_y: false
  display: ${display_name}
  on_release:
      - if:
          condition: lvgl.is_paused
          then:
            - logger.log: "LVGL resuming"
            - lvgl.resume:
            - lvgl.widget.redraw:
            - light.turn_on: display_backlight

  # on_touch:
  #   - lambda: |-
  #         ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%0d",
  #             touch.x,
  #             touch.y,
  #             touch.x_raw,
  #             touch.y_raw
  #             );

spi:
  - id: lcd_spi
    clk_pin: GPIO48
    mosi_pin: GPIO47

# display:
#   - platform: mipi_rgb
#     id: ${display_name}
#     model: GUITION-4848S040
#     rotation: 180

display:
  - platform: st7701s
    id: ${display_name}
    update_interval: never
    auto_clear_enabled: false
    data_rate: 2MHz
    spi_mode: MODE3
    color_order: RGB
    invert_colors: false
    dimensions:
      width: 480
      height: 480
    transform:
      mirror_x: false
      mirror_y: false
    cs_pin: 39
      # reset not defined 
    de_pin: 18
    hsync_pin: 16
    vsync_pin: 17
    pclk_pin: 21
    init_sequence: 
      - 1
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10] # CMD2_BKSEL_BK0
      - [0xCD, 0x00] # disable MDT flag
    pclk_frequency: 12MHz
    pclk_inverted: false
    data_pins:
      red:
        - 11         # R1
        - 12         # R2
        - 13         # R3
        - 14         # R4
        - 0          # R5
      green:
        - 8          # G0
        - 20         # G1
        - 3          # G2
        - 46         # G3
        - 9          # G4
        - 10         # G5 
      blue:
        - 4          # B1
        - 5          # B2
        - 6          # B3
        - 7          # B4
        - 15         # B5


